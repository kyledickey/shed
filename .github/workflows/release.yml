name: Release

# A push to main whose CHANGELOG.md starts with an untagged version releases
# that version, with its section as the notes. Prepare release writes the
# section; you can also write it by hand.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          set -euo pipefail
          tag="$(awk '/^## v/ { print $2; exit }' CHANGELOG.md)"
          if [ -z "$tag" ] || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Nothing to release: the newest CHANGELOG.md section ($tag) is already tagged."
            exit 0
          fi
          # The section's body, without its heading.
          awk -v tag="$tag" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          {
            echo "tag=$tag"
            echo 'notes<<EOF_NOTES'
            cat notes.md
            echo EOF_NOTES
          } >>"$GITHUB_OUTPUT"

  ci:
    needs: version
    if: needs.version.outputs.tag != ''
    # Covers every job in ci.yml, including the pull request size comment,
    # which never runs here.
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, ci]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ref: ${{ github.sha }}
      notes: ${{ needs.version.outputs.notes }}
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
